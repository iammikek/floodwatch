# Lychee link checker configuration
# https://lychee.cli.rs/configuration/

# Exclude URLs that block automated requests or are placeholders
exclude = [
    # OpenAI blocks automated requests (403)
    "https://platform.openai.com/.*",
    "https://openai.com/.*",
    # Localhost URLs (expected in installation docs)
    "http://localhost.*",
    # Placeholder links in documentation (monetisation_plan.md)
    "file://.*/docs/archive/link$",
    "file://.*/docs/archive/url$",
    # External site favicon (404, not our issue)
    "https://contributing.md/.*",
    # Open Rail Data wiki uses bot protection (403)
    "https?://wiki\\.openraildata\\.com/.*",
    # Placeholder deploy host in deployment docs
    "https://your-app\\.up\\.railway\\.app.*",
    # Sites that often block GitHub Actions / bot UAs (403/challenge)
    "https://automica\\.io/.*",
    "https://status\\.openai\\.com/.*",
]

# Ignore archived docs (many stale external refs; not part of active contract)
exclude_path = ["docs/archive"]

# Accept redirects and common bot-block / rate-limit responses as non-fatal in CI
accept = [200, 204, 301, 302, 307, 308, 403, 429]

# Resilience on flaky external hosts (esp. GitHub Actions egress)
max_retries = 3
retry_wait_time = 2
timeout = 20

# Skip email validation (default in lychee v0.21+)
include_mail = false
